<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interfaz web para inferencia de texto mediante API">
  <title>Clasificador de texto</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#172b4d;background:#f3f6fb}body{margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(620px,calc(100% - 36px));background:#fff;padding:32px;border-radius:18px;box-shadow:0 12px 40px #19365b16}h1{margin:0 0 8px}p{line-height:1.5;color:#526581}textarea{box-sizing:border-box;width:100%;height:140px;padding:14px;border:1px solid #ccd6e3;border-radius:10px;font:inherit;resize:vertical}button{margin-top:14px;background:#1457d9;color:white;border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.55}.result{margin-top:18px;padding:14px;border-radius:10px;background:#eef4ff;min-height:26px}.badge{font-size:12px;background:#fff1d9;color:#704400;padding:4px 8px;border-radius:20px}
  </style>
</head>
<body><main class="card">
  <span class="badge" id="mode">Conectando…</span>
  <h1>Clasificador de texto</h1>
  <p>Escribe un texto y la interfaz consultará el servicio de inferencia mediante <code>POST /api/predict</code>.</p>
  <form id="form"><label for="text">Texto de entrada</label><textarea id="text" maxlength="4000" required placeholder="Ejemplo: El servicio fue excelente y muy útil"></textarea><button id="submit">Clasificar</button></form>
  <div class="result" id="result" role="status" aria-live="polite">El resultado aparecerá aquí.</div>
</main>
<script>
const form=document.querySelector('#form'), out=document.querySelector('#result'), button=document.querySelector('#submit');
fetch('/health').then(r=>r.json()).then(v=>document.querySelector('#mode').textContent=v.demo?'Modo demostrativo':'Modelo configurado').catch(()=>document.querySelector('#mode').textContent='API no disponible');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;out.textContent='Procesando…';try{const r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#text').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Error de API');out.textContent=`Predicción: ${data.prediction}${data.demo?' · demostración':''}`}catch(err){out.textContent=`Error: ${err.message}`}finally{button.disabled=false}});
</script></body></html>
